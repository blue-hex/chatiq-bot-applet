<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyaw Web Widget - Test Site</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <!-- Theme Toggle Button -->
    <div class="position-fixed top-0 end-0 p-3">
        <button class="btn btn-outline-primary rounded-circle" id="themeToggle">
            <i class="bi bi-sun-fill" id="themeIcon"></i>
        </button>
    </div>

    <div class="container min-vh-100 d-flex flex-column align-items-center justify-content-center">
        <h1 class="display-5 text-center">Pyaw Web Widget Test Site</h1>
        <p class="mt-2 text-muted">You're currently testing pyaw web widget. This site is built with Bootstrap v5.</p>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dark/ Light theme configuration -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // Theme Toggle Logic
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const html = document.documentElement;

            themeToggle.addEventListener('click', () => {
                if (html.getAttribute('data-bs-theme') === 'light') {
                    html.setAttribute('data-bs-theme', 'dark');
                    themeIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
                } else {
                    html.setAttribute('data-bs-theme', 'light');
                    themeIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
                }
            });
        });
    </script>


    <!-- Pyaw Widget Scripts -->
    <script src="src/chatbot.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new ChatBot();
        });
    </script>
</body>

</html>
