<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyaw Web Widget - Test Site</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Extend Tailwind config for dark mode -->
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <!-- Theme Toggle -->
    <div class="fixed top-4 right-4">
        <button id="themeToggle"
            class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
            <svg id="sunIcon" class="w-6 h-6 text-yellow-500 dark:hidden" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="moonIcon" class="hidden w-6 h-6 text-gray-100 dark:block" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>
    </div>

    <div class="min-h-screen flex flex-col items-center justify-center px-4">
        <h1 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white text-center">
            Pyaw Web Widget Test Site
        </h1>
        <p class="mt-4 text-gray-600 dark:text-gray-400 text-center">
            You're currently testing pyaw web widget. This site is built with Tailwind CSS.
        </p>
    </div>

    <!-- Theme toggle -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // Theme Toggle Logic
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;

            themeToggle.addEventListener('click', () => {
                html.classList.toggle('dark');
            });
        });
    </script>

    <!-- Pyaw Widget Scripts -->
    <script src="src/chatbot.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new ChatBot();
        });
    </script>
</body>

</html>
